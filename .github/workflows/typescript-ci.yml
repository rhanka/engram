name: TypeScript CI

on:
  push:
    branches: ["v1", "v2", "v3", "v3-typescript", "main"]
    tags: ["v*"]
  pull_request:
    branches: ["v1", "v2", "v3", "v3-typescript", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY != '' }}
    strategy:
      matrix:
        node-version: ["20", "22", "24"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Native ABI smoke (better-sqlite3 + fs-ext)
        run: node scripts/check-native-abi.mjs

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run Mistral OCR integration test
        if: matrix.node-version == '24' && env.HAS_MISTRAL_API_KEY == 'true'
        env:
          GRAPHIFY_RUN_MISTRAL_OCR_UAT: "1"
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: npx vitest run tests/mistral-ocr.integration.test.ts

      - name: Run pipeline E2E test
        run: npx vitest run tests/pipeline.test.ts

      - name: Run MCP serve test
        run: npm run test:serve

      - name: Verify CLI works end-to-end
        run: |
          node dist/cli.js --help
          node dist/cli.js --version
          node dist/cli.js install --platform claude || true

  memory-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ENGRAM_MEMORY_REQUIRE_POSTGRES: "1"
      ENGRAM_MEMORY_POSTGRES_IMAGE_16: "postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d"
      ENGRAM_MEMORY_POSTGRES_IMAGE_17: "postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Pull pinned Postgres images
        run: |
          docker pull "$ENGRAM_MEMORY_POSTGRES_IMAGE_16"
          docker pull "$ENGRAM_MEMORY_POSTGRES_IMAGE_17"
          docker inspect --format '{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' "$ENGRAM_MEMORY_POSTGRES_IMAGE_16"
          docker inspect --format '{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' "$ENGRAM_MEMORY_POSTGRES_IMAGE_17"

      - name: Run Postgres lane in required mode
        run: npx vitest run --fileParallelism=false tests/canonical-memory-store.parity.test.ts tests/postgres-memory-store.native.test.ts

  direct-llm-uat:
    needs: test
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        # gemini retiré du CI : gemini-3.1-pro exige un projet Google facturé
        # (free tier = limit 0). Non testé en CI ; reste dispo comme provider produit.
        provider: ["anthropic", "openai", "mistral", "cohere"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run direct LLM provider UAT
        env:
          GRAPHIFY_RUN_DIRECT_LLM_UAT: "1"
          GRAPHIFY_DIRECT_LLM_PROVIDER: ${{ matrix.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: npx vitest run tests/direct-llm.integration.test.ts

  # Pre-publish UAT: npm pack → install from tarball → verify
  smoke-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install, build, and pack
        run: |
          npm ci --legacy-peer-deps
          npm run build
          TARBALL=$(npm pack 2>/dev/null | tail -1)
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV

      - name: Install from tarball in clean directory
        run: |
          mkdir /tmp/smoke-test && cd /tmp/smoke-test
          npm init -y --silent
          npm install "${{ github.workspace }}/${{ env.TARBALL }}" typescript@6.0.3 @types/node@25.8.0

      - name: Verify CLI from installed package
        run: |
          cd /tmp/smoke-test
          npx engram --help | grep -q "Usage:"
          npx engram --version | grep -qE '^[0-9]+\.[0-9]+'
          npx graphify --version 2>/dev/null | grep -qE '^[0-9]+\.[0-9]+'
          echo "CLI works from installed package (engram, and the legacy graphify alias)"

      - name: Verify CommonJS root and ESM-only mesh subpath
        run: |
          ./scripts/check-packed-surface.sh --installed /tmp/smoke-test

      - name: Verify skill files are bundled
        run: |
          cd /tmp/smoke-test
          SKILL_COUNT=$(find node_modules/@sentropic/engram/src/skills -name "*.md" | wc -l)
          if [ "$SKILL_COUNT" -lt 7 ]; then
            echo "Expected 7+ skill files, found $SKILL_COUNT"
            exit 1
          fi
          test -f node_modules/@sentropic/engram/src/skills/skill-gemini.toml
          echo "$SKILL_COUNT skill files bundled"

  # Release guard: tags must point to code already merged in the product branch.
  release-guard:
    needs: [test, smoke-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is merged into default branch
        run: |
          git fetch origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${RELEASE_BRANCH}"; then
            echo "::error::Refusing to publish ${GITHUB_REF_NAME}: ${GITHUB_SHA} is not merged into origin/${RELEASE_BRANCH}."
            echo "::error::Merge the release PR first, then move/create the release tag on ${RELEASE_BRANCH}."
            exit 1
          fi

      - name: Verify package version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}."
            exit 1
          fi

  # Publish to npm
  publish:
    needs: release-guard
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing requires a recent Node/npm pair.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@11.6.2
          node --version
          npm --version

      - name: Install and build
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Publish to npm
        run: npm publish

  # Post-publish validation: install from npm and verify
  post-publish-check:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Wait for npm propagation
        run: sleep 30

      - name: Install from npm
        run: |
          mkdir /tmp/post-publish && cd /tmp/post-publish
          npm init -y --silent
          npm install @sentropic/engram@latest

      - name: Verify CLI
        run: |
          cd /tmp/post-publish
          npx engram --help | grep -q "Usage:"
          npx engram --version
          echo "Post-publish CLI verification passed"

      - name: Verify library
        run: |
          cd /tmp/post-publish
          node -e "
            const g = require('@sentropic/engram');
            console.log('Exports:', Object.keys(g).filter(k => typeof g[k] === 'function').join(', '));
            // Quick functional test: build a graph from inline extraction
            const ext = {
              nodes: [
                {id: 'a', label: 'A', file_type: 'code', source_file: 'a.py'},
                {id: 'b', label: 'B', file_type: 'code', source_file: 'b.py'}
              ],
              edges: [{source: 'a', target: 'b', relation: 'calls', confidence: 'EXTRACTED', source_file: 'a.py'}],
              input_tokens: 0, output_tokens: 0
            };
            const G = g.buildFromJson(ext);
            console.log('Graph:', G.order, 'nodes,', G.size, 'edges');
            if (G.order !== 2 || G.size !== 1) throw new Error('Graph construction failed');
            console.log('Post-publish functional test passed');
          "

      - name: Verify skill install
        run: |
          cd /tmp/post-publish
          npx engram install --platform claude || true
          echo "Skill install command executed"

  # NOTE: `@sentropic/graph` is NOT built, tested or published from this
  # repository. It lives in the Sent Tech design system
  # (https://github.com/rhanka/sent-tech-design-system, `packages/graph`), which
  # is its sole publisher (`graph-v*` tag, npm Trusted Publishing / OIDC).
  # Engram consumes the published package from npm only: there is no in-tree
  # copy, no source alias, and no golden-webgl lane here any more. The
  # renderer's own suites (unit and golden) belong to the design system.
  #
  # Do not re-add a publish job here.
